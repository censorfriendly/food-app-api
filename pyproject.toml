[project]
name = "food-workspace-api"
version = "1.0.0"
requires-python = ">=3.11"

# ──────────────────────────────────────────────
# Ruff — linter + formatter (ESLint equivalent)
# ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes — catch unused imports, undefined names, etc.
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort — import sorting
    "N",      # pep8-naming
    "UP",     # pyupgrade — modernize syntax
    "B",      # flake8-bugbear — catch common bugs
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "T20",    # flake8-print — catch stray print() calls
    "ARG",    # flake8-unused-args — unused function arguments
    "C4",     # flake8-comprehensions — unnecessary list/set comprehensions
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "PL",     # pylint — a subset of useful rules
    "RET504", # unnecessary variable assignment before return
]
ignore = [
    "E501",   # line too long — handled by formatter
    "PLR0913",# too many arguments — common in FastAPI route handlers
    "PLR2004",# magic value comparison — acceptable in small projects
    "ARG001",# unused function arguments — common in FastAPI dependency injection
    "ARG002",# unused method arguments
    "ARG005",# unused lambda arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004", # magic values in tests are fine
    "S101",    # assertions in tests are expected
]
"__init__.py" = [
    "F401",  # unused imports in __init__ are intentional
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# ──────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
